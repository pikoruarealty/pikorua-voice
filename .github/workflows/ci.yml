name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-type-check:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm type-check
        name: Type-check all packages

      # NOTE: `pnpm lint` is currently just an alias of `type-check`, so running
      # it here would type-check twice and report nothing new. Formatting is the
      # check that actually adds signal — non-blocking because several files
      # (call-runtime.service.ts among them) already fail prettier from before
      # this was wired up. Run `pnpm format` to clear them, then make it blocking.
      - run: pnpm format:check
        name: Formatting (advisory)
        continue-on-error: true

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        name: Build all packages and apps

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        name: Build before running tests (tests require compiled dist)

      # The file list is derived from the directory, NOT enumerated by hand.
      # Hand-listing is why voice-timing, gujarati-lang, tts-normalization,
      # appointments, worker-waker, persist-fk-detection and guardrail-streaming
      # silently never ran here — a new suite was only covered if someone
      # remembered to add a step for it, and nobody did.
      #
      # integration.test.js is the one exclusion: requireApi() hard-fails (rather
      # than skipping) when CI=true and no API is reachable, and GitHub Actions
      # always sets CI=true. It has its own job below, with the stack running.
      - name: Unit tests (every suite except integration)
        run: |
          files=$(ls tools/tests/*.test.js | grep -v 'integration\.test\.js$')
          echo "Running:"; echo "$files"
          node --test $files

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pikorua_voice_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5433/pikorua_voice_test
      REDIS_URL: redis://localhost:6380
      API_AUTH_TOKEN: test-token
      REQUIRE_INTEGRATION_STACK: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        name: Build before integration tests

      - run: pnpm db:migrate
        name: Run database migrations

      - name: Start API
        run: |
          pnpm --filter @pikorua/api start > api.log 2>&1 &
          echo $! > api.pid

      - name: Wait for API health
        run: |
          for i in {1..30}; do
            if curl -fsS -H "x-api-key: test-token" http://localhost:4100/api/health; then
              exit 0
            fi
            sleep 2
          done
          cat api.log
          exit 1

      - run: node --test tools/tests/integration.test.js
        name: Integration tests

  docker-build:
    name: Docker build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t pikorua-api:ci .

      - name: Build Worker image
        run: docker build -f apps/worker/Dockerfile -t pikorua-worker:ci .
