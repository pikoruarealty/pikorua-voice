name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-type-check:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm type-check
        name: Type-check all packages

      - run: pnpm lint
        name: Lint
        continue-on-error: true # lint warnings don't block merges

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        name: Build all packages and apps

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        name: Build before running tests (tests require compiled dist)

      - run: node --test tools/tests/production-hardening.test.js
        name: Production hardening tests

      - run: node --test tools/tests/llm-routing.test.js
        name: LLM routing tests

      - run: node --test tools/tests/guardrail.test.js
        name: Guardrail tests

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pikorua_voice_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5433/pikorua_voice_test
      REDIS_URL: redis://localhost:6380
      API_AUTH_TOKEN: test-token
      REQUIRE_INTEGRATION_STACK: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        name: Build before integration tests

      - run: pnpm db:migrate
        name: Run database migrations

      - name: Start API
        run: |
          pnpm --filter @pikorua/api start > api.log 2>&1 &
          echo $! > api.pid

      - name: Wait for API health
        run: |
          for i in {1..30}; do
            if curl -fsS -H "x-api-key: test-token" http://localhost:4100/api/health; then
              exit 0
            fi
            sleep 2
          done
          cat api.log
          exit 1

      - run: node --test tools/tests/integration.test.js
        name: Integration tests

  docker-build:
    name: Docker build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t pikorua-api:ci .

      - name: Build Worker image
        run: docker build -f apps/worker/Dockerfile -t pikorua-worker:ci .
