name: Images

# Build the API + worker images and push them to GHCR, so the VM only ever pulls
# (building on the VM would pin both cores and stall live calls — deploy/README.md).
# Tags: the commit SHA (pin a deploy to it) and the branch name (e.g. "v2"), so the
# VM can follow a branch with TAG=v2. "latest" is only ever main.

on:
  push:
    branches: [main, v2]
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  push:
    name: Build & push ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: pikorua-voice-api
            dockerfile: apps/api/Dockerfile
          - image: pikorua-voice-worker
            dockerfile: apps/worker/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR image names must be lowercase.
      - name: Image name
        id: name
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ steps.name.outputs.ref }}:${{ github.sha }}
            ${{ steps.name.outputs.ref }}:${{ github.ref_name }}
            ${{ github.ref_name == 'main' && format('{0}:latest', steps.name.outputs.ref) || '' }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
