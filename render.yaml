services:
  # ── API (NestJS + WebSockets — public-facing) ──────────────────────────────
  - type: web
    name: pikorua-voice-api
    plan: free
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production

      # Set these in Render dashboard after creating Neon + Upstash accounts
      - key: DATABASE_URL
        sync: false # paste Neon connection string
      - key: REDIS_URL
        sync: false # paste Upstash Redis URL

      # ── App ──────────────────────────────────────────────────────────────
      - key: API_AUTH_TOKEN
        sync: false

      # ── Telephony · Exotel (configure later) ─────────────────────────────
      - key: EXOTEL_SID
        sync: false
      - key: EXOTEL_API_KEY
        sync: false
      - key: EXOTEL_API_TOKEN
        sync: false
      - key: EXOTEL_CALLER_ID
        sync: false
      - key: EXOTEL_APP_ID
        sync: false
      - key: EXOTEL_WEBHOOK_SECRET
        sync: false
      - key: EXOTEL_STREAM_SECRET
        sync: false
      - key: EXOTEL_SUBDOMAIN
        value: api.exotel.com
      # Set this to your Render service URL after first deploy
      - key: PUBLIC_BASE_URL
        sync: false

      # ── STT · Deepgram ───────────────────────────────────────────────────
      - key: DEEPGRAM_API_KEY
        sync: false

      # ── TTS · ElevenLabs ─────────────────────────────────────────────────
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
      - key: ELEVENLABS_MODEL
        value: eleven_turbo_v2_5
      - key: ELEVENLABS_LANGUAGE_CODE
        value: hi
      - key: ELEVENLABS_STABILITY
        value: "0.55"
      - key: ELEVENLABS_SIMILARITY_BOOST
        value: "0.9"
      - key: ELEVENLABS_STYLE
        value: "0.45"
      - key: ELEVENLABS_SPEED
        value: "1.1"

      # ── LLM · OpenRouter (Claude Haiku primary, GPT-OSS fallback) ─────────
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: anthropic/claude-haiku-4-5
      - key: OPENROUTER_FALLBACK_MODEL
        value: openai/gpt-oss-20b:free

      - key: CALL_LOCALE_DEFAULT
        value: hi-IN

      # ── Feature flags ─────────────────────────────────────────────────────
      - key: LLM_PROVIDER_OVERRIDE
        value: openrouter
      - key: GUARDRAIL_SEMANTIC_ENABLED
        value: "false"
      - key: STT_STREAMING_ENABLED
        value: "false"
      # Pipeline TTS: audio for sentence N+1 generates while N still plays, so
      # multi-sentence replies finish faster. Roll back to "false" if a call
      # regresses. (Latency tuning #3.)
      - key: TTS_WS_STREAMING_ENABLED
        value: "true"
      # Sliding-window history cap. 16 (~8 turns) trims LLM input tokens for
      # faster time-to-first-token while keeping enough margin that early facts
      # (BHK/budget) stay in context through the recommendation on non-linear
      # calls. (Prompt caching already covers the big static system-prompt cost,
      # so the extra 4 messages vs 12 add negligible latency.)
      - key: LLM_HISTORY_MAX_MESSAGES
        value: "16"
      # OPENROUTER_TIMEOUT_MS is the active per-request LLM cap (LLM_TIMEOUT_MS
      # was a no-op and has been removed). Keeps the previously-intended ~5s cap.
      - key: OPENROUTER_TIMEOUT_MS
        value: "5000"
      - key: TURN_TIMEOUT_MS
        value: "18000"

      # ── CRM (not used in demo) ────────────────────────────────────────────
      - key: CRM_API_BASE_URL
        sync: false
      - key: CRM_API_TOKEN
        sync: false

  # ── Worker (BullMQ dial queue + Exotel outbound dialing) ───────────────────
  # NOTE: deployed as `type: web` (not `worker`) because Render's free tier
  # has no Background Worker plan. A bare /health endpoint satisfies Render's
  # web-service health check. Switch to `type: worker` once on a paid plan —
  # it spins down on idle and the first dial after idle pays a ~30s cold start.
  - type: web
    name: pikorua-voice-worker
    plan: free
    env: docker
    dockerfilePath: ./apps/worker/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production

      - key: DATABASE_URL
        sync: false # same Neon connection string as the API service
      - key: REDIS_URL
        sync: false # same Upstash Redis URL as the API service

      # ── Telephony · Exotel ────────────────────────────────────────────────
      - key: EXOTEL_SID
        sync: false
      - key: EXOTEL_API_KEY
        sync: false
      - key: EXOTEL_API_TOKEN
        sync: false
      - key: EXOTEL_CALLER_ID
        sync: false
      - key: EXOTEL_APP_ID
        sync: false
      - key: EXOTEL_SUBDOMAIN
        value: api.exotel.com
      - key: PUBLIC_BASE_URL
        sync: false # same Render API URL — used for the StatusCallback

      # ── CRM (post-call sync) ──────────────────────────────────────────────
      # Worker POSTs completed calls to <CRM_API_BASE_URL>/call-results, signed
      # with the shared Bearer token + HMAC secret agreed with the CRM team.
      - key: CRM_API_BASE_URL
        sync: false # e.g. https://<crm-domain>/api/v1/voice
      - key: CRM_API_TOKEN
        sync: false # shared Bearer token (CRM's VOICE_API_BEARER_TOKEN)
      - key: CRM_WEBHOOK_HMAC_SECRET
        sync: false # shared HMAC secret (CRM's VOICE_WEBHOOK_HMAC_SECRET)

      # ── LLM scoring (optional — falls back to heuristics) ─────────────────
      - key: LLM_SCORING_PROVIDER
        value: auto
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: anthropic/claude-haiku-4-5
